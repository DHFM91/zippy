<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zippy</title>
<style>
  :root {
    --bg: #0b1220;
    --card: #141b2d;
    --text: #f1f5f9;
    --muted: #8ea0bd;
    --accent: #38bdf8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--text);
    padding: 12px;
    gap: 8px;
  }
  header { text-align: center; }
  h1 {
    margin: 0;
    font-size: 24px;
    letter-spacing: 1px;
    background: linear-gradient(90deg, #38bdf8, #a78bfa);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  p.tagline {
    margin: 2px 0 0;
    color: var(--muted);
    font-size: 12px;
  }
  p.hint {
    margin: 2px 0 0;
    color: #4ade80;
    font-size: 12px;
    font-weight: 600;
  }
  .stage-wrap {
    background: var(--card);
    border-radius: 16px;
    padding: 12px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    /* fills most of the viewport width instead of capping out at 900px, so
       the arena reads as a much bigger, more immersive play space - the
       canvas itself still renders in its original 900x600 logical
       coordinate space (see the script), just displayed larger */
    width: min(95vw, 1600px);
  }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 3 / 2;
    border-radius: 10px;
    background: #0f172a;
    cursor: crosshair;
  }
  footer {
    color: var(--muted);
    font-size: 12px;
  }

  /* ---------- touch controls ---------- */
  /* A drag joystick instead of hold-buttons: continuous drag gestures
     don't trigger iOS's long-press "select/copy" callout the way a
     sustained hold on a static button can. */
  .joystick-row {
    display: flex;
    justify-content: center;
    gap: 28px;
    margin: 16px auto 0;
  }
  .joystick-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 0;
  }
  .joystick-zone {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    background: rgba(148,163,184,0.08);
    border: 1px solid rgba(148,163,184,0.35);
    position: relative;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    transition: background-color 0.15s, border-color 0.15s;
  }
  /* while GAME OVER is showing, the same zone becomes a "ready" tap
     target instead of a drag joystick - see tryRespawn() in the script */
  .joystick-zone.confirm-mode {
    background: rgba(74,222,128,0.14);
    border: 1px solid #4ade80;
  }
  .joystick-handle {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: rgba(74,222,128,0.28);
    border: 1px solid #4ade80;
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  .joy-label {
    margin: 8px 0 0;
    color: var(--muted);
    font-size: 12px;
  }
  /* aim/shoot stick is visually distinct (red) from the move stick (green)
     so the two are never confused at a glance */
  .aim-zone {
    background: rgba(248,113,113,0.08);
    border-color: rgba(248,113,113,0.35);
  }
  .aim-handle {
    background: rgba(248,113,113,0.28);
    border-color: #f87171;
  }

  /* ---------- mobile: shrink chrome so more of the screen is game ---------- */
  @media (max-width: 640px) {
    body { padding: 8px; gap: 8px; }
    h1 { font-size: 20px; letter-spacing: 0.5px; }
    p.tagline { font-size: 10px; margin-top: 2px; }
    p.hint { font-size: 10px; margin-top: 2px; }
    .stage-wrap { padding: 8px; border-radius: 12px; }
    .joystick-row { margin-top: 8px; gap: 14px; }
    .joystick-zone { width: 112px; height: 112px; }
    .joystick-handle { width: 46px; height: 46px; }
    .joy-label { font-size: 10px; margin-top: 4px; }
  }
  @media (max-width: 640px) and (max-height: 700px) {
    p.tagline { display: none; }
  }
</style>
</head>
<body>
<header>
  <h1>ZIPPY</h1>
  <p class="tagline">Build 18 &middot; twin-stick shooting</p>
  <p class="hint">WASD to move, aim with the mouse and click (or hold) to shoot &middot; on touch, left stick moves, right stick aims &amp; shoots</p>
</header>
<div class="stage-wrap">
  <canvas id="stage" width="900" height="600"></canvas>
  <div class="joystick-row">
    <div class="joystick-wrap">
      <div class="joystick-zone" id="joystick" aria-label="Drag to steer Zippy">
        <div class="joystick-handle"></div>
      </div>
      <p class="joy-label">Drag to move</p>
    </div>
    <div class="joystick-wrap">
      <div class="joystick-zone aim-zone" id="aimJoystick" aria-label="Drag to aim and shoot">
        <div class="joystick-handle aim-handle"></div>
      </div>
      <p class="joy-label">Drag to aim &amp; shoot</p>
    </div>
  </div>
</div>
<footer>Zippy &middot; recreated from a 1999 BASIC original</footer>

<script>
(function () {
  const canvas = document.getElementById("stage");
  const ctx = canvas.getContext("2d");
  // Logical game-space, unchanged from earlier builds: every obstacle slot,
  // spawn point, HUD rectangle and pellet-wave formula below is written
  // against this 900x600 coordinate space, so it all keeps working exactly
  // as before even though the canvas now displays much bigger on screen
  // (see the .stage-wrap CSS). RENDER_SCALE instead bumps the canvas's
  // actual backing-store resolution above 900x600 (with a matching
  // ctx.scale) purely so that bigger on-screen size stays crisp rather
  // than blurring up from a small bitmap.
  const W = 900, H = 600;
  const RENDER_SCALE = 2;
  canvas.width = W * RENDER_SCALE;
  canvas.height = H * RENDER_SCALE;
  ctx.scale(RENDER_SCALE, RENDER_SCALE);
  const SPEED = 260; // px/sec, the enemy balls' starting speed at the top of each life
  const ENEMY_SPEED_RAMP = 6; // px/sec added per second survived, so it gets harder the longer you last
  const ENEMY_MAX_SPEED = 520; // cap so the ramp doesn't run away forever
  const SPECIAL_COLOR = "#4ade80";
  const READY_INPUT_DELAY_MS = 400; // brief pause before a "ready" input is accepted, so the score is readable and can't be skipped instantly
  const SPAWN_GRACE_MS = 1500; // brief invulnerability right after a respawn

  // Zippy (the player ball) has no built-in velocity of its own.
  // It only moves under WASD thrust, can go noticeably faster than the
  // other balls, and therefore bounces harder off walls/obstacles.
  const SPECIAL_MAX_SPEED = 340; // ~1.3x the other balls' constant speed
  const SPECIAL_ACCEL = 1200;    // px/sec^2 while a direction key is held
  const SPECIAL_FRICTION = 3.5;  // higher = stops faster when keys are released

  const PELLET_RADIUS = 5;
  const PELLET_COUNT = 10;   // pellets sown per wave pass (5 wave passes per life - see PELLET_WAVE_COUNT below)
  const PELLET_BONUS = 500;  // flat points added to score per pellet collected
  const PELLET_RESPAWN_MS = 15000; // ms an eaten regular pellet stays gone before reappearing at a fresh random spot
  const POPUP_LIFE = 700;    // ms a "+500" pickup popup stays on screen

  // ---------- bonus multiplier coin ----------
  // Every PELLET_EAT_STREAK regular pellets Zippy eats, one larger
  // spinning gold coin spawns at a random spot, drifting slowly off in a
  // random direction (it bounces off obstacles/walls exactly like the
  // enemy balls - see resolveObstacleCollisions/resolveWallCollisions
  // below). It's drawn gold and glowing rather than red specifically so
  // it doesn't read as a hazard ball to dodge - see drawBonusPellet().
  // Eating it doesn't add flat points itself; it activates a score
  // multiplier for a few seconds, boosting everything scored while it's
  // active (both pellet bonuses and the ongoing distance x time growth).
  const PELLET_EAT_STREAK = 10;         // regular pellets eaten per coin spawn
  const BONUS_PELLET_RADIUS = PELLET_RADIUS * 2.2;
  const BONUS_PELLET_SPEED = 70;        // px/sec - much slower than any ball, an easy target
  const BONUS_MULTIPLIER = 2.5;         // "over 2x" while active
  const BONUS_MULTIPLIER_MS = 5000;

  // ---------- storm hazard ----------
  // A slow-drifting red "storm" circle discourages camping in a tight
  // corner/wall gap - a spot that's safe from the enemy balls is not
  // necessarily safe from this. Sized so its area is roughly a sixth of
  // the arena (a circle that size reads as a real zone to avoid, not a
  // token effect); it bounces off the arena walls only (not obstacles -
  // it's weather passing over the terrain, not a solid object), and is
  // allowed to drift up to half its own width off-screen before bouncing
  // back, which is exactly what happens if the bounce is keyed off the
  // storm's *center* crossing the wall (a circle is symmetric, so when
  // its center sits exactly on the boundary, exactly half its area is
  // already off-screen) - see resolveStormWallCollisions(). While Zippy's
  // center is inside it, score drains continuously rather than in a lump,
  // consistent with how the rest of scoring accumulates frame by frame.
  // It also bogs down the enemy balls (not just Zippy) while they're
  // inside it, so it isn't purely a hazard for the player to dodge - it
  // reshuffles the whole arena's danger, occasionally turning a "safe"
  // camping spot into one where a slowed rival is easier to outmaneuver.
  const STORM_RADIUS = Math.sqrt((W * H) / (6 * Math.PI)); // area ~= 1/6 of the 900x600 arena
  const STORM_SPEED = 18;               // px/sec - much slower than even the bonus coin
  const STORM_DRAIN_PER_SEC = 500;      // points lost per second Zippy spends inside it
  const STORM_ENEMY_SLOW = 0.5;         // enemy balls move at this fraction of their normal speed while inside

  // ---------- shooting (Robotron-style twin-stick) ----------
  // Zippy can shoot in any direction independent of his movement direction
  // - WASD/move-stick steers him, while aiming (mouse, or a second touch
  // stick) fires bullets. A bullet stuns whichever enemy ball it hits for
  // STUN_MS (frozen in place - see the stun handling in tick() - but still
  // solid/lethal on touch, so stunning buys room to maneuver rather than
  // being a free kill), and chips away at whichever obstacle it hits,
  // shrinking that shape toward its own center a little more each hit
  // until it's fully gone - see damageObstacle().
  const BULLET_SPEED = 620;          // px/sec
  const BULLET_RADIUS = 4;
  const BULLET_LIFETIME_MS = 900;    // despawns after this long even if it never hits anything or leaves the arena
  const FIRE_INTERVAL_MS = 130;      // minimum ms between shots while firing is held (~7.7 shots/sec)
  const AIM_DEADZONE = 0.35;         // aim stick must be pushed at least this far from center to count as aiming/firing
  const STUN_MS = 5000;
  const OBSTACLE_HITS_TO_DESTROY = 6; // bullet hits an obstacle takes before it's fully chipped away

  // ---------- global leaderboard ----------
  // A free, no-login shared JSON bin (json.extendsclass.com) holds the top
  // scores for every player, not just this browser. GET/PUT both work
  // cross-origin with no auth on this specific bin, which is exactly what a
  // static GitHub Pages site needs since it can't run its own backend.
  // Note this is an informal, unauthenticated store - fine for a small
  // hobby leaderboard, but nothing stops someone from writing to it
  // directly if they found the URL, and it isn't guaranteed to be
  // permanent (no SLA from the free service).
  const LEADERBOARD_URL = "https://json.extendsclass.com/bin/3e101eb0a004";
  const LEADERBOARD_SIZE = 10;
  const LEADERBOARD_FETCH_TIMEOUT_MS = 6000;

  // ---------- input (keyboard) ----------
  const keys = { w: false, a: false, s: false, d: false };
  window.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if (k in keys) { keys[k] = true; e.preventDefault(); }
  });
  window.addEventListener("keyup", (e) => {
    const k = e.key.toLowerCase();
    if (k in keys) { keys[k] = false; e.preventDefault(); }
  });

  // Spacebar does double duty once GAME OVER is showing: it confirms the
  // current initials slot while entering a top-10 score, or it's the PC
  // "ready" input once the final score screen is up - see
  // confirmInitialsSlot()/tryRespawn() below. Always prevent the
  // page-scroll default for Space (it has no other use here); e.repeat is
  // ignored so holding the key down doesn't repeat the action.
  window.addEventListener("keydown", (e) => {
    if (e.code === "Space" || e.key === " ") {
      e.preventDefault();
      if (e.repeat) return;
      if (gameOver && gameOverPhase === "enterInitials") {
        confirmInitialsSlot();
      } else if (gameOver && gameOverPhase === "final") {
        tryRespawn(performance.now());
      }
      // "checking"/"submitting" - ignore input while we talk to the leaderboard
    }
  });

  // While entering initials, W/S (or the up/down arrows) cycle the active
  // slot's letter A-Z and A/D (or left/right) move which of the 3 slots is
  // active. These reuse the same physical keys as movement, but movement
  // is already frozen while gameOver is true, so there's no conflict.
  window.addEventListener("keydown", (e) => {
    if (!(gameOver && gameOverPhase === "enterInitials")) return;
    const k = e.key.toLowerCase();
    if (k === "w" || k === "arrowup") { e.preventDefault(); cycleInitialLetter(1); }
    else if (k === "s" || k === "arrowdown") { e.preventDefault(); cycleInitialLetter(-1); }
    else if (k === "a" || k === "arrowleft") { e.preventDefault(); if (!e.repeat) moveInitialsSlot(-1); }
    else if (k === "d" || k === "arrowright") { e.preventDefault(); if (!e.repeat) moveInitialsSlot(1); }
  });

  // ---------- input (touch joystick) ----------
  // Drag anywhere in the joystick zone; the handle follows the finger
  // (clamped to a max radius) and the drag vector becomes an analog
  // thrust direction/strength, fed into the same physics as WASD below.
  // This is a continuous drag gesture rather than a held button, which
  // is what actually avoids iOS's long-press "select/copy" callout.
  // While GAME OVER is showing, the same zone doubles as a "ready" tap
  // target instead - see the pointerdown handler and tryRespawn() below.
  const touch = { x: 0, y: 0 }; // -1..1 per axis, magnitude <= 1
  const joyZone = document.getElementById("joystick");
  const joyHandle = joyZone ? joyZone.querySelector(".joystick-handle") : null;
  const joyLabel = joyZone ? joyZone.parentElement.querySelector(".joy-label") : null;
  let joyPointerId = null;

  // Mobile equivalent of the W/A/S/D initials controls: drag up/down to
  // cycle the active slot's letter, drag left/right to move slots, and a
  // clean tap (little to no movement) confirms - see the pointerdown
  // handler below and cycleInitialLetter()/moveInitialsSlot().
  const INITIALS_DRAG_STEP = 18; // px of drag per letter/slot step
  let initialsDragStartX = 0, initialsDragStartY = 0;
  let initialsDragAccumX = 0, initialsDragAccumY = 0;
  let initialsDragMoved = false;

  function setHandle(dx, dy) {
    if (joyHandle) joyHandle.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  }

  function joyMove(e) {
    if (joyPointerId === null || e.pointerId !== joyPointerId) return;
    e.preventDefault();
    if (gameOver && gameOverPhase === "enterInitials") {
      const dx = e.clientX - initialsDragStartX;
      const dy = e.clientY - initialsDragStartY;
      if (Math.abs(dx) > 6 || Math.abs(dy) > 6) initialsDragMoved = true;
      while (dy - initialsDragAccumY < -INITIALS_DRAG_STEP) { cycleInitialLetter(1); initialsDragAccumY -= INITIALS_DRAG_STEP; }
      while (dy - initialsDragAccumY > INITIALS_DRAG_STEP) { cycleInitialLetter(-1); initialsDragAccumY += INITIALS_DRAG_STEP; }
      while (dx - initialsDragAccumX > INITIALS_DRAG_STEP) { moveInitialsSlot(1); initialsDragAccumX += INITIALS_DRAG_STEP; }
      while (dx - initialsDragAccumX < -INITIALS_DRAG_STEP) { moveInitialsSlot(-1); initialsDragAccumX -= INITIALS_DRAG_STEP; }
      return;
    }
    const rect = joyZone.getBoundingClientRect();
    // max travel is read live from the zone's rendered size (rather than a
    // fixed px constant) so the mobile CSS media query, which shrinks the
    // joystick, "just works" without any JS changes to match it
    const maxR = rect.width / 2 - 6;
    let dx = e.clientX - (rect.left + rect.width / 2);
    let dy = e.clientY - (rect.top + rect.height / 2);
    const dist = Math.hypot(dx, dy);
    if (dist > maxR) {
      dx = (dx / dist) * maxR;
      dy = (dy / dist) * maxR;
    }
    touch.x = dx / maxR;
    touch.y = dy / maxR;
    setHandle(dx, dy);
  }
  function joyEnd(e) {
    if (joyPointerId === null || e.pointerId !== joyPointerId) return;
    if (gameOver && gameOverPhase === "enterInitials") {
      joyPointerId = null;
      if (!initialsDragMoved) confirmInitialsSlot(); // a clean tap confirms the current slot
      return;
    }
    joyPointerId = null;
    touch.x = 0;
    touch.y = 0;
    setHandle(0, 0);
  }
  if (joyZone) {
    joyZone.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      if (gameOver && gameOverPhase === "enterInitials") {
        joyPointerId = e.pointerId;
        joyZone.setPointerCapture(e.pointerId);
        initialsDragStartX = e.clientX;
        initialsDragStartY = e.clientY;
        initialsDragAccumX = 0;
        initialsDragAccumY = 0;
        initialsDragMoved = false;
        return;
      }
      if (gameOver && gameOverPhase === "final") {
        // final score screen is showing - this tap is a "ready" confirmation,
        // not the start of a drag, so skip the joystick tracking below
        tryRespawn(performance.now());
        return;
      }
      if (gameOver) return; // "checking"/"submitting" - ignore taps while we talk to the leaderboard
      joyPointerId = e.pointerId;
      joyZone.setPointerCapture(e.pointerId);
      joyMove(e);
    });
    joyZone.addEventListener("pointermove", joyMove);
    joyZone.addEventListener("pointerup", joyEnd);
    joyZone.addEventListener("pointercancel", joyEnd);
    joyZone.addEventListener("contextmenu", (e) => e.preventDefault());
  }

  // ---------- input (touch joystick, aim & shoot) ----------
  // A second, independent drag stick - same drag-to-vector mechanics as
  // the move stick above, tracked under its own pointer id so both sticks
  // can be held by different fingers at once. Its vector doubles as both
  // the aim direction and the "is firing" signal (see getFireState()
  // below): push it past AIM_DEADZONE and Zippy shoots that way. It's
  // inert during any GAME OVER phase - only the move stick does double
  // duty there (initials entry / tap-to-continue).
  const aim = { x: 0, y: 0 }; // -1..1 per axis, magnitude <= 1
  const aimZone = document.getElementById("aimJoystick");
  const aimHandle = aimZone ? aimZone.querySelector(".joystick-handle") : null;
  let aimPointerId = null;

  function setAimHandle(dx, dy) {
    if (aimHandle) aimHandle.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  }

  function aimMove(e) {
    if (aimPointerId === null || e.pointerId !== aimPointerId) return;
    e.preventDefault();
    const rect = aimZone.getBoundingClientRect();
    const maxR = rect.width / 2 - 6;
    let dx = e.clientX - (rect.left + rect.width / 2);
    let dy = e.clientY - (rect.top + rect.height / 2);
    const dist = Math.hypot(dx, dy);
    if (dist > maxR) {
      dx = (dx / dist) * maxR;
      dy = (dy / dist) * maxR;
    }
    aim.x = dx / maxR;
    aim.y = dy / maxR;
    setAimHandle(dx, dy);
  }
  function aimEnd(e) {
    if (aimPointerId === null || e.pointerId !== aimPointerId) return;
    aimPointerId = null;
    aim.x = 0;
    aim.y = 0;
    setAimHandle(0, 0);
  }
  if (aimZone) {
    aimZone.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      if (gameOver) return; // aim stick has no role in any GAME OVER phase
      aimPointerId = e.pointerId;
      aimZone.setPointerCapture(e.pointerId);
      aimMove(e);
    });
    aimZone.addEventListener("pointermove", aimMove);
    aimZone.addEventListener("pointerup", aimEnd);
    aimZone.addEventListener("pointercancel", aimEnd);
    aimZone.addEventListener("contextmenu", (e) => e.preventDefault());
  }

  // ---------- input (mouse aim & shoot, desktop) ----------
  // Move the mouse to aim, hold the left button to fire - independent of
  // WASD movement, exactly like the touch aim stick above. Coordinates are
  // converted from CSS pixels into the game's fixed 900x600 logical space
  // (the canvas is displayed much larger than that - see RENDER_SCALE)
  // using the canvas's own rendered rect, so it stays correct at any
  // screen size.
  const mouse = { x: W / 2, y: H / 2, down: false };
  function updateMouseFromEvent(e) {
    const rect = canvas.getBoundingClientRect();
    mouse.x = (e.clientX - rect.left) / rect.width * W;
    mouse.y = (e.clientY - rect.top) / rect.height * H;
  }
  canvas.addEventListener("mousemove", updateMouseFromEvent);
  canvas.addEventListener("mousedown", (e) => {
    if (e.button !== 0) return;
    updateMouseFromEvent(e);
    mouse.down = true;
  });
  window.addEventListener("mouseup", (e) => {
    if (e.button === 0) mouse.down = false;
  });
  canvas.addEventListener("mouseleave", () => { mouse.down = false; });
  canvas.addEventListener("contextmenu", (e) => e.preventDefault());

  // Resolves whichever aim input is currently active into one direction +
  // firing flag. The aim stick takes priority when pushed past its
  // deadzone (so a touch player holding both sticks always gets stick
  // aim); otherwise a held left mouse button aims at the live cursor
  // position. Returns firing:false if neither is active or Zippy isn't
  // on the field to aim from.
  function getFireState(special) {
    const aimMag = Math.hypot(aim.x, aim.y);
    if (aimMag > AIM_DEADZONE) {
      return { firing: true, dx: aim.x / aimMag, dy: aim.y / aimMag };
    }
    if (mouse.down && special) {
      const dx = mouse.x - special.x, dy = mouse.y - special.y;
      const dist = Math.hypot(dx, dy);
      if (dist > 0.001) return { firing: true, dx: dx / dist, dy: dy / dist };
    }
    return { firing: false, dx: 0, dy: 0 };
  }

  // ---------- geometry helpers ----------
  // Irregular, jagged polygon generator used for obstacles. Each vertex
  // gets its own radius jitter (how spiky/uneven the outline is) and a
  // bit of angular jitter (uneven vertex spacing), then the whole shape
  // can be stretched along one axis for an elongated shard-like look.
  // Angular jitter is capped well under half the average angular step,
  // so vertex angles stay strictly increasing around the shape - that
  // keeps every generated polygon simple (no self-intersecting edges),
  // even though the outline itself can be mildly concave/jaggedy.
  function jaggedShape(cx, cy, baseR, sides, jaggedness, rotationDeg, stretchX, stretchY) {
    const pts = [];
    const rot = (rotationDeg || 0) * Math.PI / 180;
    const angleStep = (Math.PI * 2) / sides;
    for (let i = 0; i < sides; i++) {
      const rVariance = 1 + (Math.random() * 2 - 1) * jaggedness;
      const r = baseR * rVariance;
      const angleJitter = (Math.random() * 2 - 1) * angleStep * 0.32;
      const a = rot + i * angleStep + angleJitter;
      const localX = r * Math.cos(a) * stretchX;
      const localY = r * Math.sin(a) * stretchY;
      pts.push([cx + localX, cy + localY]);
    }
    return pts;
  }

  function edgesOf(points) {
    const edges = [];
    for (let i = 0; i < points.length; i++) {
      edges.push([points[i], points[(i + 1) % points.length]]);
    }
    return edges;
  }

  function centroidOf(points) {
    let sx = 0, sy = 0;
    for (const [x, y] of points) { sx += x; sy += y; }
    return [sx / points.length, sy / points.length];
  }

  function randRange(min, max) { return min + Math.random() * (max - min); }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  // ---------- obstacles ----------
  // Five fixed "slots" (positions + accent colors) that stay clear of the
  // spawn points and HUD boxes; the actual shape in each slot is re-rolled
  // every life - random vertex count, jaggedness and stretch so every
  // rock/crystal formation comes out looking a little different, never a
  // clean regular polygon or straight-edged bar.
  const OBSTACLE_SLOTS = [
    { cx: 210, cy: 150, fill: "rgba(56,189,248,0.16)", stroke: "#38bdf8" },
    { cx: 690, cy: 140, fill: "rgba(250,204,21,0.16)", stroke: "#facc15" },
    { cx: 460, cy: 470, fill: "rgba(167,139,250,0.16)", stroke: "#a78bfa" },
    { cx: 170, cy: 460, fill: "rgba(74,222,128,0.16)", stroke: "#4ade80" },
    { cx: 770, cy: 300, fill: "rgba(249,115,22,0.16)", stroke: "#f97316" }
  ];

  function generateObstacles() {
    return OBSTACLE_SLOTS.map(slot => {
      const sides = 7 + Math.floor(randRange(0, 7));  // 7..13 - more vertices reads as jaggedy rather than a clean polygon
      const baseR = randRange(44, 74);
      const jaggedness = randRange(0.22, 0.5);         // per-vertex radius variance
      const rotation = randRange(0, 360);
      const stretchX = randRange(0.75, 1.3);           // occasional elongated shard look
      const stretchY = randRange(0.75, 1.3);
      const points = jaggedShape(slot.cx, slot.cy, baseR, sides, jaggedness, rotation, stretchX, stretchY);
      // basePoints/centroid/hits back the bullet-chipping system below
      // (damageObstacle): points/edges are the *current* (possibly
      // shrunk) shape actually drawn and collided against, recomputed
      // from basePoints scaled toward centroid each time it's hit, while
      // basePoints itself is never mutated.
      return {
        points, fill: slot.fill, stroke: slot.stroke, edges: edgesOf(points),
        basePoints: points, centroid: centroidOf(points), hits: 0, destroyed: false
      };
    });
  }

  let obstacles = generateObstacles();

  // A bullet hit chips an obstacle down: each hit shrinks it a bit more
  // toward its own centroid, until OBSTACLE_HITS_TO_DESTROY hits fully
  // clears it from the arena. Shares the same shrink-toward-center idea
  // as nothing else in the game, but reuses centroidOf/edgesOf above so
  // the resulting shape is just a smaller version of the same polygon -
  // no new geometry code needed for collision/rendering to keep working.
  function damageObstacle(obs, now) {
    obs.hits++;
    const remaining = Math.max(0, 1 - obs.hits / OBSTACLE_HITS_TO_DESTROY);
    if (remaining <= 0.02) {
      obs.destroyed = true;
      popups.push({ x: obs.centroid[0], y: obs.centroid[1], text: "shattered!", born: now, color: [148, 163, 184] });
      return;
    }
    const [ccx, ccy] = obs.centroid;
    obs.points = obs.basePoints.map(([x, y]) => [ccx + (x - ccx) * remaining, ccy + (y - ccy) * remaining]);
    obs.edges = edgesOf(obs.points);
    popups.push({ x: obs.centroid[0] + randRange(-14, 14), y: obs.centroid[1] + randRange(-14, 14), text: "chip!", born: now, color: [148, 163, 184] });
  }

  function bulletHitsObstacle(b, obs) {
    if (pointInPolygon(b.x, b.y, obs.points)) return true;
    for (const [a, c] of obs.edges) {
      const [cx, cy] = closestPointOnSegment(b.x, b.y, a[0], a[1], c[0], c[1]);
      if (Math.hypot(b.x - cx, b.y - cy) < BULLET_RADIUS + 3) return true;
    }
    return false;
  }

  // ---------- pellets ----------
  // Pacman-style bonus pellets, sown along randomly chosen sine, cosine
  // and tangent waves across the arena (several waves layered together
  // for a big field of pellets). Each one is a flat, significant point
  // bonus the moment Zippy touches it - re-rolled every life.
  const PELLET_WAVE_COUNT = 5; // separate wave passes layered per life
  const PELLET_PLACEMENT_ATTEMPTS = 8; // random-relocation retries before giving up on a pellet

  // standard ray-casting point-in-polygon test - needed because obstacles
  // can be large enough that their center is farther than `margin` from
  // every edge, so an edge-distance check alone misses pellets that land
  // deep inside a shape rather than near its border
  function pointInPolygon(x, y, points) {
    let inside = false;
    for (let i = 0, j = points.length - 1; i < points.length; j = i++) {
      const xi = points[i][0], yi = points[i][1];
      const xj = points[j][0], yj = points[j][1];
      const intersect = ((yi > y) !== (yj > y)) &&
        (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
      if (intersect) inside = !inside;
    }
    return inside;
  }

  function tooCloseToObstacle(x, y, margin) {
    for (const obs of obstacles) {
      if (pointInPolygon(x, y, obs.points)) return true;
      for (const [a, b] of obs.edges) {
        const [cx, cy] = closestPointOnSegment(x, y, a[0], a[1], b[0], b[1]);
        if (Math.hypot(x - cx, y - cy) < margin) return true;
      }
    }
    return false;
  }

  function inHudZone(x, y) {
    const pad = 10;
    if (x > 10 - pad && x < 160 + pad && y > 10 - pad && y < 54 + pad) return true;          // DISTANCE box
    if (x > W - 160 - pad && x < W - 10 + pad && y > 10 - pad && y < 54 + pad) return true;  // TIME box
    if (x > W / 2 - 100 - pad && x < W / 2 + 100 + pad && y > 10 - pad && y < 64 + pad) return true; // SCORE box
    return false;
  }

  // a pellet is never allowed to sit inside a bounce-shape (or the HUD);
  // if its wave position lands there, it gets re-rolled to a fresh random
  // spot on the field instead of just being skipped
  function placePellet(x, y, out) {
    let px = x, py = y;
    let attempts = 0;
    while ((tooCloseToObstacle(px, py, PELLET_RADIUS + 6) || inHudZone(px, py)) && attempts < PELLET_PLACEMENT_ATTEMPTS) {
      px = randRange(30, W - 30);
      py = randRange(85, H - 20);
      attempts++;
    }
    if (!tooCloseToObstacle(px, py, PELLET_RADIUS + 6) && !inHudZone(px, py)) {
      out.push({ x: px, y: py, r: PELLET_RADIUS, collected: false });
    }
  }

  function generatePelletWave(out) {
    const waveType = pick(["sin", "cos", "tan"]);
    const amplitude = randRange(40, 90);
    const freq = randRange(1.5, 3.5);
    const phase = randRange(0, Math.PI * 2);
    // each wave's baseline is drawn at a random angle (0-180deg - a line at
    // theta looks the same as theta+180, so that range covers every distinct
    // orientation) through a random center point, instead of always running
    // straight left-to-right, so the 5 layered waves crosshatch into a more
    // uniform-looking field instead of stacked horizontal bands
    const angle = randRange(0, Math.PI);
    const length = randRange(360, 560);
    const cx = randRange(150, W - 150);
    const cy = randRange(180, H - 130);
    const cosA = Math.cos(angle), sinA = Math.sin(angle);

    for (let i = 0; i < PELLET_COUNT; i++) {
      const t = i / (PELLET_COUNT - 1) - 0.5; // -0.5..0.5 along the baseline
      const along = t * length;
      const theta = (t + 0.5) * freq * Math.PI * 2 + phase;
      let raw;
      if (waveType === "sin") raw = Math.sin(theta);
      else if (waveType === "cos") raw = Math.cos(theta);
      else raw = Math.max(-1, Math.min(1, Math.tan(theta) * 0.3)); // tan blows up near its asymptotes, so scale + clamp it
      const across = raw * amplitude;

      // rotate the (along, across) point by `angle` around the origin,
      // then place it relative to this wave's center point
      const x = cx + along * cosA - across * sinA;
      const y = cy + along * sinA + across * cosA;
      const clampedX = Math.max(30, Math.min(W - 30, x));
      const clampedY = Math.max(85, Math.min(H - 20, y));
      placePellet(clampedX, clampedY, out);
    }
  }

  function generatePellets() {
    const out = [];
    for (let wave = 0; wave < PELLET_WAVE_COUNT; wave++) {
      generatePelletWave(out);
    }
    return out;
  }

  // Picks a random spot clear of every obstacle and the HUD, for anything
  // that needs a fresh random position rather than a wave-placed one - the
  // bonus coin's spawn point and a regular pellet's respawn point both
  // reuse this (see randomBonusPelletSpot() and the pellet respawn logic
  // in tick() below).
  function randomOpenSpot(radius) {
    let x, y, attempts = 0;
    do {
      x = randRange(30, W - 30);
      y = randRange(85, H - 20);
      attempts++;
    } while ((tooCloseToObstacle(x, y, radius + 6) || inHudZone(x, y)) && attempts < 20);
    return { x, y };
  }

  function randomBonusPelletSpot() {
    return randomOpenSpot(BONUS_PELLET_RADIUS);
  }

  function spawnBonusPellet() {
    const { x, y } = randomBonusPelletSpot();
    const angle = Math.random() * Math.PI * 2;
    return {
      x, y,
      vx: Math.cos(angle) * BONUS_PELLET_SPEED,
      vy: Math.sin(angle) * BONUS_PELLET_SPEED,
      r: BONUS_PELLET_RADIUS,
      collected: false
    };
  }

  // Starts away from the balls' spawn cluster (roughly (450,300)) so it
  // isn't sitting on top of Zippy the instant a life begins.
  function spawnStorm() {
    let x, y;
    do {
      x = randRange(0, W);
      y = randRange(0, H);
    } while (Math.hypot(x - 450, y - 300) < 250);
    const angle = Math.random() * Math.PI * 2;
    return {
      x, y,
      vx: Math.cos(angle) * STORM_SPEED,
      vy: Math.sin(angle) * STORM_SPEED,
      r: STORM_RADIUS
    };
  }

  let pellets = generatePellets();
  let bonusPellet = null;         // at most one on the field at a time
  let pelletsEatenThisLife = 0;   // counts toward the next bonus-pellet spawn
  let storm = spawnStorm();
  let inStorm = false;            // true while Zippy is inside the storm right now (read by the HUD)
  let popups = []; // transient pickup feedback text ("+500", "x2.5 SCORE!", ...)
  let bullets = [];    // Zippy's shots in flight - see getFireState()/tick()
  let nextFireAt = 0;  // performance.now() timestamp the next shot is allowed

  // ---------- balls ----------
  // Zippy (special) spawns away from the other four, in a clear corner,
  // so a respawn doesn't land it right back in the middle of the pack.
  // The other four each get their own angry/mean face style (faceVariant
  // 0-3), so every rival looks distinct.
  const colors = ["#38bdf8", "#f97316", "#facc15", "#a78bfa", "#4ade80"];
  const spawnPoints = [[400, 300], [500, 300], [450, 250], [450, 350], [450, 130]];
  const RADIUS = 11;

  function initBalls() {
    return spawnPoints.map((p, i) => {
      const special = colors[i] === SPECIAL_COLOR;
      const angle = Math.random() * Math.PI * 2;
      return {
        x: p[0], y: p[1],
        vx: special ? 0 : Math.cos(angle) * SPEED,
        vy: special ? 0 : Math.sin(angle) * SPEED,
        r: RADIUS,
        color: colors[i],
        special,
        faceVariant: i % 4,
        stunnedUntil: 0 // a bullet hit sets this to now+STUN_MS; see tick()
      };
    });
  }

  // ---------- score / high score (localStorage) ----------
  // score is simply distance * timeSurvived, recalculated live every
  // frame so it's always current on screen (not just at game over).
  function loadBest() {
    try {
      const d = parseFloat(localStorage.getItem("zippy_bestDistance"));
      const t = parseFloat(localStorage.getItem("zippy_bestTime"));
      const s = parseFloat(localStorage.getItem("zippy_bestScore"));
      return { d: isFinite(d) ? d : 0, t: isFinite(t) ? t : 0, s: isFinite(s) ? s : 0 };
    } catch (e) {
      return { d: 0, t: 0, s: 0 }; // storage blocked (private mode, file://, etc.)
    }
  }
  function saveBest(d, t, s) {
    try {
      localStorage.setItem("zippy_bestDistance", String(Math.round(d)));
      localStorage.setItem("zippy_bestTime", String(Math.round(t)));
      localStorage.setItem("zippy_bestScore", String(Math.round(s)));
    } catch (e) { /* ignore - best-effort persistence */ }
  }
  function pad(n, width) {
    return String(Math.max(0, Math.round(n))).padStart(width || 4, "0");
  }

  const loaded = loadBest();
  let bestDistance = loaded.d;
  let bestTime = loaded.t;
  let bestScore = loaded.s;
  let newBestDistance = false;
  let newBestTime = false;
  let newBestScore = false;
  let distance = 0;
  let timeSurvived = 0;
  let pelletScore = 0;
  let score = 0;
  // score = max(0, survivalScore + pelletScore). survivalScore accumulates
  // the distance x time growth frame by frame (rather than recomputing the
  // product fresh each frame) specifically so the active-multiplier
  // window below can scale each frame's increment, and so the storm
  // hazard's continuous drain can subtract from the same running total -
  // see the scoring block in tick(). With no multiplier and no storm time
  // it telescopes back to exactly distance * timeSurvived, so normal play
  // is unaffected; the final max(0, ...) just keeps a storm-heavy run from
  // showing a negative score.
  let survivalScore = 0;
  let prevDistanceTimeProduct = 0;
  let scoreMultiplier = 1;   // >1 while a bonus pellet's boost is active
  let multiplierUntil = 0;   // performance.now() timestamp the boost ends

  let balls = initBalls();
  let gameOver = false;
  let gameOverAt = 0;
  let graceUntil = 0;

  // ---------- global leaderboard (top 10, shared across every player) ----------
  // gameOverPhase tracks where we are on the GAME OVER screen:
  //   "checking"      - just died, fetching the live global list to see if
  //                      this run's score makes the top 10
  //   "enterInitials" - it does; player is picking 3 letters
  //   "submitting"    - initials confirmed, writing the new entry back
  //   "final"         - settled; showing stats + the top-10 board, waiting
  //                      for the "ready" input to respawn
  let gameOverPhase = "final";
  let highScores = [];        // cached global top-10, refreshed on load and after every death
  let highScoresError = false; // last fetch/submit to the shared store failed - shown as a small note, never blocks play
  let initialsChars = ["A", "A", "A"];
  let initialsSlot = 0;
  let lastQualifyingEntry = null; // the entry this life just added, so it can be highlighted in the list

  async function fetchWithTimeout(url, options) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), LEADERBOARD_FETCH_TIMEOUT_MS);
    try {
      return await fetch(url, Object.assign({}, options, { signal: controller.signal }));
    } finally {
      clearTimeout(timer);
    }
  }

  // Refreshes the cached global top-10 from the shared store. Best-effort:
  // on any failure (offline, timeout, bad data) it just leaves the existing
  // cache in place and flags highScoresError, rather than blocking play.
  async function fetchHighScores() {
    try {
      const resp = await fetchWithTimeout(LEADERBOARD_URL, { cache: "no-store" });
      if (!resp.ok) throw new Error("bad status " + resp.status);
      const data = await resp.json();
      if (Array.isArray(data)) {
        highScores = data
          .filter(e => e && typeof e.score === "number" && typeof e.initials === "string")
          .map(e => ({ initials: e.initials.slice(0, 3).toUpperCase(), score: e.score }))
          .sort((a, b) => b.score - a.score)
          .slice(0, LEADERBOARD_SIZE);
      }
      highScoresError = false;
    } catch (e) {
      highScoresError = true;
    }
  }

  function qualifiesForHighScore(candidateScore) {
    return highScores.length < LEADERBOARD_SIZE || candidateScore > highScores[highScores.length - 1].score;
  }

  // Re-fetches the freshest list, merges the new entry in, and writes the
  // result back - the re-fetch-then-merge is a light best-effort defense
  // against two players submitting at almost the same moment, though with
  // an unauthenticated shared bin a rare lost update is still possible
  // (acceptable for a casual hobby leaderboard).
  async function submitHighScore(entry) {
    await fetchHighScores();
    const merged = highScores.concat([entry]).sort((a, b) => b.score - a.score).slice(0, LEADERBOARD_SIZE);
    try {
      const resp = await fetchWithTimeout(LEADERBOARD_URL, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(merged)
      });
      if (!resp.ok) throw new Error("bad status " + resp.status);
      highScores = merged;
      highScoresError = false;
    } catch (e) {
      // couldn't reach the shared store - still show the entry locally so
      // the player sees their score placed, even though it didn't save
      highScores = merged;
      highScoresError = true;
    }
  }

  // ---------- collision helpers ----------
  function closestPointOnSegment(px, py, ax, ay, bx, by) {
    const abx = bx - ax, aby = by - ay;
    const t0 = ((px - ax) * abx + (py - ay) * aby) / (abx * abx + aby * aby);
    const t = Math.max(0, Math.min(1, t0));
    return [ax + abx * t, ay + aby * t];
  }

  function normalize(x, y) {
    const len = Math.hypot(x, y) || 1;
    return [x / len, y / len];
  }

  function resolveObstacleCollisions(ball) {
    for (const obs of obstacles) {
      for (const [a, b] of obs.edges) {
        const [cx, cy] = closestPointOnSegment(ball.x, ball.y, a[0], a[1], b[0], b[1]);
        const dx = ball.x - cx, dy = ball.y - cy;
        const dist = Math.hypot(dx, dy);
        if (dist < ball.r && dist > 0.0001) {
          const [nx, ny] = normalize(dx, dy);
          const dot = ball.vx * nx + ball.vy * ny;
          if (dot < 0) {
            ball.vx -= 2 * dot * nx;
            ball.vy -= 2 * dot * ny;
          }
          const overlap = ball.r - dist + 0.5;
          ball.x += nx * overlap;
          ball.y += ny * overlap;
        }
      }
    }
  }

  function resolveWallCollisions(ball) {
    if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
    if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); }
    if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); }
    if (ball.y + ball.r > H) { ball.y = H - ball.r; ball.vy = -Math.abs(ball.vy); }
  }

  // Same idea as resolveWallCollisions, but keyed off the storm's *center*
  // reaching the wall instead of its edge - that's what lets it drift up
  // to 50% off-screen before bouncing back (see the storm hazard comment
  // above the STORM_RADIUS/STORM_SPEED constants).
  function resolveStormWallCollisions(storm) {
    if (storm.x < 0) { storm.x = 0; storm.vx = Math.abs(storm.vx); }
    if (storm.x > W) { storm.x = W; storm.vx = -Math.abs(storm.vx); }
    if (storm.y < 0) { storm.y = 0; storm.vy = Math.abs(storm.vy); }
    if (storm.y > H) { storm.y = H; storm.vy = -Math.abs(storm.vy); }
  }

  // keep speed exactly constant for the non-player balls, even after
  // floating point drift from repeated bounces
  function clampSpeed(ball, speed) {
    const [nx, ny] = normalize(ball.vx, ball.vy);
    ball.vx = nx * speed;
    ball.vy = ny * speed;
  }

  // enemy balls start at SPEED and ramp up the longer the current life lasts
  function enemySpeedNow() {
    return Math.min(ENEMY_MAX_SPEED, SPEED + ENEMY_SPEED_RAMP * timeSurvived);
  }

  // WASD / touch thrust + friction + hard speed cap for Zippy
  function applyPlayerControl(ball, dt) {
    // combine digital WASD with the analog joystick drag into one
    // thrust vector; magnitude scales the accel so a light drag on the
    // joystick gives a gentler push than shoving it to the edge
    let ax = 0, ay = 0;
    if (keys.w) ay -= 1;
    if (keys.s) ay += 1;
    if (keys.a) ax -= 1;
    if (keys.d) ax += 1;
    ax += touch.x;
    ay += touch.y;
    const inputMag = Math.hypot(ax, ay);
    if (inputMag > 0.0001) {
      const scale = Math.min(inputMag, 1);
      const nx = ax / inputMag, ny = ay / inputMag;
      ball.vx += nx * SPECIAL_ACCEL * scale * dt;
      ball.vy += ny * SPECIAL_ACCEL * scale * dt;
    }
    const decay = Math.exp(-SPECIAL_FRICTION * dt);
    ball.vx *= decay;
    ball.vy *= decay;
    const speed = Math.hypot(ball.vx, ball.vy);
    if (speed > SPECIAL_MAX_SPEED) {
      const s = SPECIAL_MAX_SPEED / speed;
      ball.vx *= s;
      ball.vy *= s;
    }
  }

  function checkSpecialCollision() {
    const special = balls.find(b => b.special);
    if (!special) return false;
    for (const other of balls) {
      if (other === special) continue;
      const dx = other.x - special.x, dy = other.y - special.y;
      const dist = Math.hypot(dx, dy);
      if (dist < other.r + special.r) return true;
    }
    return false;
  }

  // ---------- ready / respawn / initials entry ----------
  // GAME OVER now waits indefinitely for the player to confirm they're
  // ready (spacebar on PC, or a tap on the joystick zone on touch) rather
  // than auto-continuing after a fixed timer - but first, if this run's
  // score makes the global top 10, it detours through an initials-entry
  // screen. See gameOverPhase above for the state machine.
  function updateJoyUiForState() {
    if (!gameOver) {
      if (joyLabel) joyLabel.textContent = "Drag to steer";
      if (joyZone) joyZone.classList.remove("confirm-mode");
      return;
    }
    if (gameOverPhase === "enterInitials") {
      if (joyLabel) joyLabel.textContent = "Drag = letter/slot · Tap = confirm";
      if (joyZone) joyZone.classList.add("confirm-mode");
    } else if (gameOverPhase === "final") {
      if (joyLabel) joyLabel.textContent = "Tap to continue";
      if (joyZone) joyZone.classList.add("confirm-mode");
    } else {
      if (joyLabel) joyLabel.textContent = "Please wait…";
      if (joyZone) joyZone.classList.remove("confirm-mode");
    }
  }

  function cycleInitialLetter(dir) {
    const A = "A".charCodeAt(0);
    let idx = initialsChars[initialsSlot].charCodeAt(0) - A;
    idx = (idx + dir + 26) % 26;
    initialsChars[initialsSlot] = String.fromCharCode(A + idx);
  }

  function moveInitialsSlot(dir) {
    initialsSlot = Math.max(0, Math.min(2, initialsSlot + dir));
  }

  function confirmInitialsSlot() {
    if (gameOverPhase !== "enterInitials") return;
    if (initialsSlot < 2) {
      initialsSlot++;
    } else {
      finalizeHighScore();
    }
  }

  async function finalizeHighScore() {
    const entry = { initials: initialsChars.join(""), score: Math.round(score) };
    lastQualifyingEntry = entry;
    gameOverPhase = "submitting";
    updateJoyUiForState();
    await submitHighScore(entry);
    if (!gameOver) return; // player somehow already moved on - don't stomp new state
    gameOverPhase = "final";
    updateJoyUiForState();
  }

  function tryRespawn(now) {
    if (!gameOver || gameOverPhase !== "final") return;
    if (now - gameOverAt < READY_INPUT_DELAY_MS) return; // ignore input in the first instant so the score is readable and can't be skipped by accident
    gameOver = false;
    gameOverPhase = "final";
    lastQualifyingEntry = null;
    balls = initBalls();
    obstacles = generateObstacles();
    pellets = generatePellets();
    bonusPellet = null;
    pelletsEatenThisLife = 0;
    storm = spawnStorm();
    inStorm = false;
    popups = [];
    // release any held joystick drag so a finger resting on the stick
    // from the previous life doesn't hand Zippy instant full thrust
    // the moment the new life starts
    joyPointerId = null;
    touch.x = 0;
    touch.y = 0;
    setHandle(0, 0);
    // same idea for the aim stick and a held mouse button - a new life
    // shouldn't start already firing because of leftover input state
    aimPointerId = null;
    aim.x = 0;
    aim.y = 0;
    setAimHandle(0, 0);
    mouse.down = false;
    bullets = [];
    nextFireAt = 0;
    graceUntil = now + SPAWN_GRACE_MS;
    distance = 0;
    timeSurvived = 0;
    pelletScore = 0;
    score = 0;
    survivalScore = 0;
    prevDistanceTimeProduct = 0;
    scoreMultiplier = 1;
    multiplierUntil = 0;
    newBestDistance = false;
    newBestTime = false;
    newBestScore = false;
    updateJoyUiForState();
  }

  // ---------- render ----------
  function drawObstacle(obs) {
    ctx.beginPath();
    obs.points.forEach(([x, y], i) => {
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.closePath();
    ctx.fillStyle = obs.fill;
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = obs.stroke;
    ctx.stroke();
  }

  function drawFace(ball, sad) {
    const r = ball.r;
    const eyeY = ball.y - r * 0.25;
    ctx.fillStyle = "#0b1220";
    ctx.beginPath();
    ctx.arc(ball.x - r * 0.35, eyeY, r * 0.13, 0, Math.PI * 2);
    ctx.arc(ball.x + r * 0.35, eyeY, r * 0.13, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.lineWidth = Math.max(1.2, r * 0.16);
    ctx.strokeStyle = "#0b1220";
    ctx.lineCap = "round";
    const mouthR = r * 0.42;
    if (sad) {
      ctx.arc(ball.x, ball.y + r * 0.6, mouthR, Math.PI, Math.PI * 2, false);
    } else {
      ctx.arc(ball.x, ball.y + r * 0.05, mouthR, 0, Math.PI, false);
    }
    ctx.stroke();
  }

  // Four distinct angry/mean faces for the four non-player balls, so
  // every rival reads as its own little villain rather than a copy.
  function drawAngryFace(ball, variant) {
    const r = ball.r;
    const x = ball.x, y = ball.y;
    ctx.fillStyle = "#0b1220";
    ctx.strokeStyle = "#0b1220";
    ctx.lineCap = "round";
    const eyeY = y - r * 0.15;
    const eyeDX = r * 0.38;

    if (variant === 0) {
      // Classic fury: sharp V eyebrows, round glaring eyes, downturned frown
      ctx.lineWidth = Math.max(1.1, r * 0.17);
      ctx.beginPath();
      ctx.moveTo(x - eyeDX - r * 0.25, eyeY - r * 0.08);
      ctx.lineTo(x - eyeDX + r * 0.18, eyeY - r * 0.38);
      ctx.moveTo(x + eyeDX + r * 0.25, eyeY - r * 0.08);
      ctx.lineTo(x + eyeDX - r * 0.18, eyeY - r * 0.38);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(x - eyeDX, eyeY, r * 0.11, 0, Math.PI * 2);
      ctx.arc(x + eyeDX, eyeY, r * 0.11, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.lineWidth = Math.max(1.1, r * 0.16);
      ctx.arc(x, y + r * 0.62, r * 0.4, Math.PI, Math.PI * 2, false);
      ctx.stroke();

    } else if (variant === 1) {
      // Sneering: wide angled-up eyebrows, squinted eyes, jagged bared-teeth mouth
      ctx.lineWidth = Math.max(1.1, r * 0.17);
      ctx.beginPath();
      ctx.moveTo(x - eyeDX - r * 0.24, eyeY - r * 0.32);
      ctx.lineTo(x - eyeDX + r * 0.2, eyeY - r * 0.08);
      ctx.moveTo(x + eyeDX + r * 0.24, eyeY - r * 0.32);
      ctx.lineTo(x + eyeDX - r * 0.2, eyeY - r * 0.08);
      ctx.stroke();

      ctx.lineWidth = Math.max(1, r * 0.12);
      ctx.beginPath();
      ctx.moveTo(x - eyeDX - r * 0.13, eyeY);
      ctx.lineTo(x - eyeDX + r * 0.13, eyeY);
      ctx.moveTo(x + eyeDX - r * 0.13, eyeY);
      ctx.lineTo(x + eyeDX + r * 0.13, eyeY);
      ctx.stroke();

      const my = y + r * 0.55, mw = r * 0.45;
      ctx.lineWidth = Math.max(1, r * 0.12);
      ctx.beginPath();
      ctx.moveTo(x - mw, my);
      ctx.lineTo(x - mw * 0.5, my + r * 0.16);
      ctx.lineTo(x, my - r * 0.02);
      ctx.lineTo(x + mw * 0.5, my + r * 0.16);
      ctx.lineTo(x + mw, my);
      ctx.stroke();

    } else if (variant === 2) {
      // Grumpy glare: thick low brows almost on the eyes, narrow slits, flat mouth
      ctx.lineWidth = Math.max(1.3, r * 0.2);
      ctx.beginPath();
      ctx.moveTo(x - eyeDX - r * 0.22, eyeY - r * 0.2);
      ctx.lineTo(x - eyeDX + r * 0.22, eyeY - r * 0.2);
      ctx.moveTo(x + eyeDX - r * 0.22, eyeY - r * 0.2);
      ctx.lineTo(x + eyeDX + r * 0.22, eyeY - r * 0.2);
      ctx.stroke();

      ctx.lineWidth = Math.max(1, r * 0.11);
      ctx.beginPath();
      ctx.moveTo(x - eyeDX - r * 0.14, eyeY + r * 0.02);
      ctx.lineTo(x - eyeDX + r * 0.14, eyeY + r * 0.02);
      ctx.moveTo(x + eyeDX - r * 0.14, eyeY + r * 0.02);
      ctx.lineTo(x + eyeDX + r * 0.14, eyeY + r * 0.02);
      ctx.stroke();

      ctx.lineWidth = Math.max(1.2, r * 0.16);
      ctx.beginPath();
      ctx.moveTo(x - r * 0.38, y + r * 0.6);
      ctx.lineTo(x + r * 0.38, y + r * 0.6);
      ctx.stroke();

    } else {
      // Devious smirk: mismatched eyebrows and eyes, crooked one-sided smirk
      ctx.lineWidth = Math.max(1.1, r * 0.17);
      ctx.beginPath();
      ctx.moveTo(x - eyeDX - r * 0.22, eyeY - r * 0.1);
      ctx.lineTo(x - eyeDX + r * 0.2, eyeY - r * 0.35);
      ctx.moveTo(x + eyeDX + r * 0.24, eyeY - r * 0.3);
      ctx.lineTo(x + eyeDX - r * 0.2, eyeY - r * 0.12);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(x - eyeDX, eyeY, r * 0.11, 0, Math.PI * 2);
      ctx.fill();
      ctx.lineWidth = Math.max(1, r * 0.1);
      ctx.beginPath();
      ctx.moveTo(x + eyeDX - r * 0.12, eyeY);
      ctx.lineTo(x + eyeDX + r * 0.12, eyeY);
      ctx.stroke();

      ctx.lineWidth = Math.max(1.1, r * 0.15);
      ctx.beginPath();
      ctx.moveTo(x - r * 0.3, y + r * 0.5);
      ctx.quadraticCurveTo(x + r * 0.05, y + r * 0.72, x + r * 0.4, y + r * 0.42);
      ctx.stroke();
    }
  }

  function drawPellet(p) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = "#fde68a";
    ctx.shadowColor = "#fde68a";
    ctx.shadowBlur = 8;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // A spinning gold coin rather than a plain circle, so it reads at a
  // glance as an inviting pickup rather than another hazard ball to
  // dodge - warm gold/amber tones throughout, never red or orange (those
  // are the enemy balls' palette). The spin is simulated by squashing
  // the coin's horizontal radius with a cosine wave: it narrows down to
  // a thin edge-on sliver and back out to full width, exactly like a
  // tossed coin turning face-to-edge-to-face. A soft pulsing glow and a
  // sweeping highlight (brightest face-on, gone edge-on) sell the shine.
  function drawBonusPellet(p, now) {
    const spin = Math.cos(now / 260); // -1..1, one full "flip" every ~1.6s
    const rx = Math.max(2, p.r * Math.abs(spin));
    const ry = p.r;

    const pulse = 0.5 + 0.5 * Math.sin(now / 300);
    const glowR = p.r * (2.1 + 0.4 * pulse);
    const glow = ctx.createRadialGradient(p.x, p.y, p.r * 0.3, p.x, p.y, glowR);
    glow.addColorStop(0, "rgba(251,191,36,0.5)");
    glow.addColorStop(1, "rgba(251,191,36,0)");
    ctx.beginPath();
    ctx.arc(p.x, p.y, glowR, 0, Math.PI * 2);
    ctx.fillStyle = glow;
    ctx.fill();

    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.beginPath();
    ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
    const coinGrad = ctx.createLinearGradient(-rx, -ry, rx, ry);
    coinGrad.addColorStop(0, "#fde68a");
    coinGrad.addColorStop(0.5, "#fbbf24");
    coinGrad.addColorStop(1, "#b45309");
    ctx.fillStyle = coinGrad;
    ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = "#78350f";
    ctx.stroke();

    // bright shine streak, fades out as the coin turns edge-on
    if (rx > p.r * 0.25) {
      ctx.beginPath();
      ctx.ellipse(-rx * 0.25, -ry * 0.3, rx * 0.35, ry * 0.18, -0.4, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${(0.55 * Math.abs(spin)).toFixed(2)})`;
      ctx.fill();
    }
    ctx.restore();
  }

  // Translucent, churning red storm circle. Layered soft-edged "gust"
  // blobs slowly orbit inside it (clipped to the storm's own circle) on
  // top of a base radial fill, for a turbulent look rather than a flat
  // dot; a thin ring traces its true extent so its edge still reads
  // clearly even where the fill alone is faint.
  function drawStorm(storm, now) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(storm.x, storm.y, storm.r, 0, Math.PI * 2);
    ctx.clip();

    const base = ctx.createRadialGradient(storm.x, storm.y, storm.r * 0.1, storm.x, storm.y, storm.r);
    base.addColorStop(0, "rgba(239,68,68,0.28)");
    base.addColorStop(0.7, "rgba(239,68,68,0.16)");
    base.addColorStop(1, "rgba(239,68,68,0.05)");
    ctx.beginPath();
    ctx.arc(storm.x, storm.y, storm.r, 0, Math.PI * 2);
    ctx.fillStyle = base;
    ctx.fill();

    const gustCount = 4;
    for (let i = 0; i < gustCount; i++) {
      const angle = now / 2600 + (i / gustCount) * Math.PI * 2;
      const gx = storm.x + Math.cos(angle) * storm.r * 0.5;
      const gy = storm.y + Math.sin(angle) * storm.r * 0.5;
      const gr = storm.r * 0.42;
      const gust = ctx.createRadialGradient(gx, gy, 0, gx, gy, gr);
      gust.addColorStop(0, "rgba(220,38,38,0.22)");
      gust.addColorStop(1, "rgba(220,38,38,0)");
      ctx.beginPath();
      ctx.arc(gx, gy, gr, 0, Math.PI * 2);
      ctx.fillStyle = gust;
      ctx.fill();
    }
    ctx.restore();

    ctx.beginPath();
    ctx.arc(storm.x, storm.y, storm.r, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(239,68,68,0.45)";
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  function drawPopups(now) {
    if (!popups.length) return;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    for (const p of popups) {
      const t = Math.min(1, (now - p.born) / POPUP_LIFE);
      ctx.font = (p.big ? "bold 20px " : "bold 14px ") + "-apple-system, BlinkMacSystemFont, monospace";
      const [r, g, b] = p.color || [253, 230, 138];
      ctx.fillStyle = `rgba(${r},${g},${b},${(1 - t).toFixed(3)})`;
      ctx.fillText(p.text, p.x, p.y - t * 26);
    }
  }

  // Soft pulsing glow behind Zippy, drawn underneath the diamond so he
  // reads as distinct from the four (circular) rivals at a glance even in
  // a crowded, busier-looking arena.
  function drawHalo(ball, now) {
    const pulse = 0.5 + 0.5 * Math.sin(now / 260);
    const haloR = ball.r * (2.4 + 0.5 * pulse);
    const grad = ctx.createRadialGradient(ball.x, ball.y, ball.r * 0.5, ball.x, ball.y, haloR);
    grad.addColorStop(0, "rgba(74,222,128,0.55)");
    grad.addColorStop(0.55, "rgba(74,222,128,0.16)");
    grad.addColorStop(1, "rgba(74,222,128,0)");
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, haloR, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();
  }

  // A stunned ball's "seeing stars" - three little stars orbiting just
  // above its head while it's frozen (STUN_MS - see tick()).
  function drawStunStars(ball, now) {
    ctx.fillStyle = "#7dd3fc";
    ctx.font = "bold 10px -apple-system, BlinkMacSystemFont, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "alphabetic";
    for (let i = 0; i < 3; i++) {
      const a = now / 260 + i * (Math.PI * 2 / 3);
      const sx = ball.x + Math.cos(a) * ball.r * 1.7;
      const sy = ball.y - ball.r * 1.7 + Math.sin(a) * 4;
      ctx.fillText("✦", sx, sy);
    }
  }

  function drawBall(ball, now) {
    const stunned = !ball.special && ball.stunnedUntil && now < ball.stunnedUntil;
    if (ball.special) drawHalo(ball, now);
    if (stunned) {
      const pulse = 0.5 + 0.5 * Math.sin(now / 130);
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r * (1.5 + 0.3 * pulse), 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(125,211,252,${0.45 + 0.3 * pulse})`;
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    ctx.beginPath();
    if (ball.special) {
      // Zippy is a diamond now instead of a circle, so he's shape-distinct
      // from the four round rivals, not just color-distinct. Sized a
      // little past the collision radius (which stays a circle for the
      // physics) so the diamond reads as roughly the same visual size as
      // the old ball rather than looking smaller.
      const dr = ball.r * 1.3;
      ctx.moveTo(ball.x, ball.y - dr);
      ctx.lineTo(ball.x + dr, ball.y);
      ctx.lineTo(ball.x, ball.y + dr);
      ctx.lineTo(ball.x - dr, ball.y);
      ctx.closePath();
    } else {
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    }
    ctx.fillStyle = stunned ? "#93c5fd" : ball.color;
    ctx.shadowColor = ball.color;
    ctx.shadowBlur = ball.special ? 18 : 12;
    ctx.fill();
    ctx.shadowBlur = 0;
    if (ball.special) {
      ctx.lineWidth = 2;
      ctx.strokeStyle = "rgba(255,255,255,0.55)";
      ctx.stroke();
      drawFace(ball, gameOver);
    } else {
      drawAngryFace(ball, ball.faceVariant);
      if (stunned) drawStunStars(ball, now);
    }
  }

  // White-hot with a cyan glow - deliberately far from every other color
  // in play (gold pellets/coin, red storm, orange/purple/etc. obstacle
  // accents) so a bullet always reads as "weapon", never "pickup".
  function drawBullet(b) {
    ctx.beginPath();
    ctx.arc(b.x, b.y, BULLET_RADIUS, 0, Math.PI * 2);
    ctx.fillStyle = "#f8fafc";
    ctx.shadowColor = "#67e8f9";
    ctx.shadowBlur = 10;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  function drawHud(now) {
    ctx.fillStyle = "rgba(11,18,32,0.55)";
    ctx.fillRect(10, 10, 150, 44);
    ctx.fillRect(W - 160, 10, 150, 44);

    ctx.textAlign = "left";
    ctx.textBaseline = "top";
    ctx.fillStyle = "#8ea0bd";
    ctx.font = "10px -apple-system, BlinkMacSystemFont, sans-serif";
    ctx.fillText("DISTANCE", 20, 16);
    ctx.fillStyle = "#38bdf8";
    ctx.font = "bold 18px -apple-system, BlinkMacSystemFont, monospace";
    ctx.fillText(pad(distance), 20, 30);

    ctx.textAlign = "right";
    ctx.fillStyle = "#8ea0bd";
    ctx.font = "10px -apple-system, BlinkMacSystemFont, sans-serif";
    ctx.fillText("TIME", W - 20, 16);
    ctx.fillStyle = "#facc15";
    ctx.font = "bold 18px -apple-system, BlinkMacSystemFont, monospace";
    ctx.fillText(pad(timeSurvived) + "s", W - 20, 30);

    // live SCORE (distance x time) + persistent best, shown continuously
    // while playing rather than only at game over
    const boxW = 200, boxH = 54, bx = W / 2 - boxW / 2, by = 10;
    ctx.fillStyle = "rgba(11,18,32,0.55)";
    ctx.fillRect(bx, by, boxW, boxH);

    ctx.textAlign = "center";
    ctx.fillStyle = "#8ea0bd";
    ctx.font = "10px -apple-system, BlinkMacSystemFont, sans-serif";
    ctx.fillText("SCORE", W / 2, by + 6);

    ctx.fillStyle = "#f472b6";
    ctx.font = "bold 20px -apple-system, BlinkMacSystemFont, monospace";
    ctx.fillText(pad(score, 6), W / 2, by + 20);

    // While the bonus multiplier is active, swap the "best" line for a
    // countdown so the boost stays visible without growing the HUD box;
    // the storm drain warning takes priority over both if it's also true,
    // since standing in the storm is the more urgent thing to react to.
    if (inStorm) {
      ctx.fillStyle = "#f87171";
      ctx.font = "bold 10px -apple-system, BlinkMacSystemFont, sans-serif";
      ctx.fillText("IN STORM -" + STORM_DRAIN_PER_SEC + "/s", W / 2, by + 40);
    } else if (scoreMultiplier > 1 && now < multiplierUntil) {
      const remaining = (multiplierUntil - now) / 1000;
      ctx.fillStyle = "#fbbf24";
      ctx.font = "bold 10px -apple-system, BlinkMacSystemFont, sans-serif";
      ctx.fillText("×" + BONUS_MULTIPLIER + " SCORE " + remaining.toFixed(1) + "s", W / 2, by + 40);
    } else {
      ctx.fillStyle = "#8ea0bd";
      ctx.font = "10px -apple-system, BlinkMacSystemFont, sans-serif";
      ctx.fillText("best " + pad(bestScore, 6), W / 2, by + 40);
    }
  }

  // Shared "GAME OVER" title + DISTANCE/TIME/SCORE lines, used by every
  // phase of the game-over screen; returns the y cursor so each phase can
  // keep drawing its own content below it.
  function drawGameOverStatsBlock() {
    let y = H / 2 - 132;

    ctx.fillStyle = "#f87171";
    ctx.font = "bold 40px -apple-system, BlinkMacSystemFont, sans-serif";
    ctx.fillText("GAME OVER", W / 2, y);
    y += 44;

    ctx.font = "bold 17px -apple-system, BlinkMacSystemFont, monospace";
    ctx.fillStyle = "#38bdf8";
    ctx.fillText(
      "DISTANCE " + pad(distance) + (newBestDistance ? "   ★ NEW BEST" : "   best " + pad(bestDistance)),
      W / 2, y
    );
    y += 26;
    ctx.fillStyle = "#facc15";
    ctx.fillText(
      "TIME " + pad(timeSurvived) + "s" + (newBestTime ? "   ★ NEW BEST" : "   best " + pad(bestTime) + "s"),
      W / 2, y
    );
    y += 26;
    ctx.fillStyle = "#f472b6";
    ctx.fillText(
      "SCORE " + pad(score, 6) + (newBestScore ? "   ★ NEW BEST" : "   best " + pad(bestScore, 6)),
      W / 2, y
    );
    y += 30;
    return y;
  }

  // "checking" (just died, talking to the leaderboard) and "submitting"
  // (initials confirmed, writing the entry) look the same - stats plus a
  // single status line - so they share this one draw function.
  function drawGameOverBusy(message) {
    ctx.fillStyle = "rgba(11,18,32,0.82)";
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    let y = drawGameOverStatsBlock();
    y += 16;
    ctx.fillStyle = "#8ea0bd";
    ctx.font = "14px -apple-system, BlinkMacSystemFont, sans-serif";
    ctx.fillText(message, W / 2, y);
  }

  // This run's score cracked the global top 10 - let the player pick 3
  // initials (W/S or drag up/down: letter, A/D or drag left/right: slot,
  // SPACE or tap: confirm) before showing the settled score screen.
  function drawInitialsEntry() {
    ctx.fillStyle = "rgba(11,18,32,0.88)";
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    let y = H / 2 - 120;
    ctx.fillStyle = "#4ade80";
    ctx.font = "bold 26px -apple-system, BlinkMacSystemFont, sans-serif";
    ctx.fillText("TOP " + LEADERBOARD_SIZE + " GLOBAL SCORE!", W / 2, y);
    y += 34;

    ctx.fillStyle = "#f472b6";
    ctx.font = "bold 20px -apple-system, BlinkMacSystemFont, monospace";
    ctx.fillText("SCORE " + pad(score, 6), W / 2, y);
    y += 56;

    const boxW = 60, boxGap = 16, totalW = boxW * 3 + boxGap * 2;
    const startX = W / 2 - totalW / 2;
    const boxY = y - 30, boxH = 64;
    for (let i = 0; i < 3; i++) {
      const bx = startX + i * (boxW + boxGap);
      const active = i === initialsSlot;
      ctx.fillStyle = active ? "rgba(74,222,128,0.18)" : "rgba(255,255,255,0.06)";
      ctx.fillRect(bx, boxY, boxW, boxH);
      ctx.lineWidth = active ? 3 : 1.5;
      ctx.strokeStyle = active ? "#4ade80" : "rgba(255,255,255,0.35)";
      ctx.strokeRect(bx, boxY, boxW, boxH);

      ctx.fillStyle = active ? "#4ade80" : "#f1f5f9";
      ctx.font = "bold 34px -apple-system, BlinkMacSystemFont, monospace";
      ctx.fillText(initialsChars[i], bx + boxW / 2, boxY + boxH / 2 + 2);

      if (active) {
        ctx.font = "bold 16px -apple-system, BlinkMacSystemFont, sans-serif";
        ctx.fillStyle = "#4ade80";
        ctx.fillText("▲", bx + boxW / 2, boxY - 14);
        ctx.fillText("▼", bx + boxW / 2, boxY + boxH + 14);
      }
    }
    y = boxY + boxH + 46;

    ctx.fillStyle = "#8ea0bd";
    ctx.font = "13px -apple-system, BlinkMacSystemFont, sans-serif";
    ctx.fillText("W/S or drag up/down: change letter · A/D or drag left/right: move", W / 2, y);
    y += 20;
    ctx.fillText("SPACE or tap: confirm letter, then confirm again to save", W / 2, y);
  }

  // Settled game-over screen: stats plus the live global top-10 board.
  function drawGameOver() {
    ctx.fillStyle = "rgba(11,18,32,0.82)";
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    let y = drawGameOverStatsBlock();

    ctx.font = "bold 13px -apple-system, BlinkMacSystemFont, sans-serif";
    ctx.fillStyle = "#8ea0bd";
    ctx.fillText("GLOBAL TOP " + LEADERBOARD_SIZE + (highScoresError ? "  (offline - showing last known)" : ""), W / 2, y);
    y += 18;

    ctx.font = "bold 14px -apple-system, BlinkMacSystemFont, monospace";
    for (let i = 0; i < LEADERBOARD_SIZE; i++) {
      const entry = highScores[i];
      const rank = String(i + 1).padStart(2, " ");
      if (entry) {
        ctx.fillStyle = entry === lastQualifyingEntry ? "#4ade80" : "#f1f5f9";
        ctx.fillText(rank + ". " + entry.initials.padEnd(3, " ") + "   " + pad(entry.score, 6), W / 2, y);
      } else {
        ctx.fillStyle = "#3f4b61";
        ctx.fillText(rank + ". ---   " + pad(0, 6), W / 2, y);
      }
      y += 16;
    }
    y += 16;

    ctx.fillStyle = "#f1f5f9";
    ctx.font = "14px -apple-system, BlinkMacSystemFont, sans-serif";
    ctx.fillText("Press SPACE or tap the control below when ready", W / 2, y);
  }

  function render(now) {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "#0f172a";
    ctx.fillRect(0, 0, W, H);
    obstacles.forEach(drawObstacle);
    if (!gameOver) {
      pellets.forEach((p) => { if (!p.collected) drawPellet(p); });
      if (bonusPellet) drawBonusPellet(bonusPellet, now);
    }
    balls.forEach((b) => drawBall(b, now));
    if (!gameOver) bullets.forEach(drawBullet);
    if (!gameOver) drawStorm(storm, now);
    if (gameOver) {
      if (gameOverPhase === "checking") drawGameOverBusy("Checking the global leaderboard…");
      else if (gameOverPhase === "enterInitials") drawInitialsEntry();
      else if (gameOverPhase === "submitting") drawGameOverBusy("Saving your score to the leaderboard…");
      else drawGameOver();
    } else {
      // unmistakable feedback that points are draining right now, on top
      // of the HUD's own "-500/s" line (see drawHud) - a soft red vignette
      // at the screen edges rather than anything that would obscure play
      if (inStorm) {
        const vignette = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) / 3, W / 2, H / 2, Math.min(W, H) / 1.15);
        vignette.addColorStop(0, "rgba(239,68,68,0)");
        vignette.addColorStop(1, "rgba(239,68,68,0.22)");
        ctx.fillStyle = vignette;
        ctx.fillRect(0, 0, W, H);
      }
      drawHud(now);
      drawPopups(now);
    }
  }

  // ---------- loop ----------
  let last = performance.now();
  function tick(now) {
    let dt = (now - last) / 1000;
    dt = Math.min(dt, 0.033); // clamp to avoid big jumps on tab switch
    last = now;

    if (gameOver) {
      // frozen on the GAME OVER screen until the player confirms ready -
      // see tryRespawn(), triggered by spacebar or a joystick-zone tap
    } else {
      timeSurvived += dt;
      if (scoreMultiplier > 1 && now >= multiplierUntil) scoreMultiplier = 1;

      // Storm hazard moves first each frame, ahead of the balls loop
      // below, so both the enemy-slowdown check and the player-in-storm
      // check later see this frame's storm position rather than lagging
      // a frame behind it. It bounces off the arena walls only (not
      // obstacles - see resolveStormWallCollisions).
      storm.x += storm.vx * dt;
      storm.y += storm.vy * dt;
      resolveStormWallCollisions(storm);

      for (const ball of balls) {
        if (ball.special) {
          applyPlayerControl(ball, dt);
        } else if (ball.stunnedUntil && now < ball.stunnedUntil) {
          // a stunned ball is frozen in place - no movement, no collision
          // resolution needed since it isn't going anywhere - but it's
          // still solid: checkSpecialCollision() below doesn't check stun
          // state, so bumping into it is still game over
          continue;
        }
        ball.x += ball.vx * dt;
        ball.y += ball.vy * dt;
        resolveObstacleCollisions(ball);
        resolveWallCollisions(ball);
        if (ball.special) {
          distance += Math.hypot(ball.vx, ball.vy) * dt;
        } else {
          // enemy balls bog down to STORM_ENEMY_SLOW of their normal
          // speed while inside the storm - it slows rivals down too,
          // not just Zippy
          const inStormNow = Math.hypot(ball.x - storm.x, ball.y - storm.y) < storm.r + ball.r;
          clampSpeed(ball, enemySpeedNow() * (inStormNow ? STORM_ENEMY_SLOW : 1));
        }
      }

      const special = balls.find(b => b.special);

      // Pacman-style pellet pickups: a flat, significant bonus straight
      // into score (boosted while the multiplier is active). Every
      // PELLET_EAT_STREAK eaten, spawn the bonus pellet if none is
      // currently out there. An eaten pellet isn't gone for the rest of
      // the life - it reappears PELLET_RESPAWN_MS later at a fresh random
      // spot (never inside an obstacle/HUD, via randomOpenSpot), so a long
      // run doesn't thin the field out to nothing. Pellets stay in the
      // array the whole life; `collected` just gates drawing/eating/timing.
      if (pellets.length && special) {
        for (const p of pellets) {
          if (p.collected) {
            if (now >= p.respawnAt) {
              const spot = randomOpenSpot(PELLET_RADIUS);
              p.x = spot.x;
              p.y = spot.y;
              p.collected = false;
            }
            continue;
          }
          if (Math.hypot(special.x - p.x, special.y - p.y) < special.r + p.r) {
            p.collected = true;
            p.respawnAt = now + PELLET_RESPAWN_MS;
            const gained = PELLET_BONUS * scoreMultiplier;
            pelletScore += gained;
            pelletsEatenThisLife++;
            popups.push({ x: p.x, y: p.y, text: "+" + Math.round(gained), born: now });
            if (!bonusPellet && pelletsEatenThisLife % PELLET_EAT_STREAK === 0) {
              bonusPellet = spawnBonusPellet();
            }
          }
        }
      }

      // Bonus pellet: drifts and bounces exactly like a ball (reusing the
      // same obstacle/wall collision helpers), and eating it starts the
      // score multiplier rather than adding flat points itself.
      if (bonusPellet && special) {
        bonusPellet.x += bonusPellet.vx * dt;
        bonusPellet.y += bonusPellet.vy * dt;
        resolveObstacleCollisions(bonusPellet);
        resolveWallCollisions(bonusPellet);
        if (Math.hypot(special.x - bonusPellet.x, special.y - bonusPellet.y) < special.r + bonusPellet.r) {
          scoreMultiplier = BONUS_MULTIPLIER;
          multiplierUntil = now + BONUS_MULTIPLIER_MS;
          popups.push({ x: bonusPellet.x, y: bonusPellet.y, text: "×" + BONUS_MULTIPLIER + " SCORE!", born: now, color: [251, 191, 36], big: true });
          bonusPellet = null;
        }
      }

      // Shooting: aim (mouse or the second touch stick) is entirely
      // independent of movement, Robotron-style - Zippy can run one way
      // and shoot another at the same time. Firing is rate-limited by
      // FIRE_INTERVAL_MS rather than per-press, since both input methods
      // are "hold to fire". Bullets are simple - constant velocity,
      // culled on a lifetime or leaving the arena - and are checked
      // against enemy balls (stun) and obstacles (chip damage) below.
      if (special && now >= graceUntil) {
        const fire = getFireState(special);
        if (fire.firing && now >= nextFireAt) {
          bullets.push({
            x: special.x + fire.dx * (special.r + 4),
            y: special.y + fire.dy * (special.r + 4),
            vx: fire.dx * BULLET_SPEED,
            vy: fire.dy * BULLET_SPEED,
            born: now
          });
          nextFireAt = now + FIRE_INTERVAL_MS;
        }
      }
      for (let bi = bullets.length - 1; bi >= 0; bi--) {
        const b = bullets[bi];
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        let spent = (now - b.born > BULLET_LIFETIME_MS) ||
          b.x < -10 || b.x > W + 10 || b.y < -10 || b.y > H + 10;
        if (!spent) {
          for (const ball of balls) {
            if (ball.special) continue;
            if (Math.hypot(ball.x - b.x, ball.y - b.y) < ball.r + BULLET_RADIUS) {
              ball.stunnedUntil = now + STUN_MS;
              popups.push({ x: ball.x, y: ball.y, text: "STUN!", born: now, color: [125, 211, 252] });
              spent = true;
              break;
            }
          }
        }
        if (!spent) {
          for (const obs of obstacles) {
            if (bulletHitsObstacle(b, obs)) {
              damageObstacle(obs, now);
              spent = true;
              break;
            }
          }
        }
        if (spent) bullets.splice(bi, 1);
      }
      if (obstacles.some(o => o.destroyed)) obstacles = obstacles.filter(o => !o.destroyed);

      // Storm hazard already moved earlier this frame (before the balls
      // loop, so the enemy-slowdown check above saw this frame's storm
      // position) - this is just the player-in-storm check for scoring.
      inStorm = now >= graceUntil && !!special &&
        Math.hypot(special.x - storm.x, special.y - storm.y) < storm.r + special.r;

      popups = popups.filter(p => now - p.born < POPUP_LIFE);

      // survivalScore accumulates this frame's share of distance x time
      // growth, scaled by whatever multiplier is active right now, minus
      // whatever the storm drains this frame if Zippy is currently inside
      // it - see the declaration above for why this telescopes back to
      // the plain distance * timeSurvived formula when neither is in play.
      const distanceTimeProduct = distance * timeSurvived;
      survivalScore += (distanceTimeProduct - prevDistanceTimeProduct) * scoreMultiplier;
      prevDistanceTimeProduct = distanceTimeProduct;
      if (inStorm) survivalScore -= STORM_DRAIN_PER_SEC * dt;
      score = Math.max(0, survivalScore + pelletScore);
      if (now >= graceUntil && checkSpecialCollision()) {
        gameOver = true;
        gameOverAt = now;
        if (distance > bestDistance) { bestDistance = distance; newBestDistance = true; }
        if (timeSurvived > bestTime) { bestTime = timeSurvived; newBestTime = true; }
        if (score > bestScore) { bestScore = score; newBestScore = true; }
        if (newBestDistance || newBestTime || newBestScore) saveBest(bestDistance, bestTime, bestScore);

        // check the live global list before deciding whether to offer
        // initials entry - see gameOverPhase above for the state machine
        gameOverPhase = "checking";
        lastQualifyingEntry = null;
        updateJoyUiForState();
        const dyingScore = score;
        fetchHighScores().then(() => {
          if (!gameOver) return; // shouldn't happen (respawn is blocked outside "final"), but guard anyway
          if (qualifiesForHighScore(dyingScore)) {
            gameOverPhase = "enterInitials";
            initialsChars = ["A", "A", "A"];
            initialsSlot = 0;
          } else {
            gameOverPhase = "final";
          }
          updateJoyUiForState();
        });
      }
    }

    render(now);
    requestAnimationFrame(tick);
  }

  render(performance.now());
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
